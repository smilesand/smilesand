<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Habits Metrics Placeholder</title>
  <desc id="desc">Habits metrics will be generated automatically by GitHub Actions after the first workflow run.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="55%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="900" height="220" rx="20" fill="url(#bg)"/>
  <text x="50%" y="44%" text-anchor="middle" font-size="34" font-family="Segoe UI, Arial, sans-serif" fill="#ffffff">GitHub Habits</text>
  <text x="50%" y="63%" text-anchor="middle" font-size="18" font-family="Segoe UI, Arial, sans-serif" fill="#ccfbf1">Will refresh automatically after the workflow runs.</text>
</svg>